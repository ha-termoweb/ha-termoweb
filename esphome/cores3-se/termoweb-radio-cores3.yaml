# Termoweb radio gateway for the M5Stack CoreS3 SE + Module CC1101, with a touch
# screen that shows each heater (name, temperature, set point, heating state).
#
# Files: copy this file, cores3_display.h, cores3_gfx.h, cores3_font.h and
# ../termoweb_radio.h into one ESPHome folder. See README.md in this folder.
#
# Radio notice:
#   This device TRANSMITS on 869.525 MHz, in the European 869.4-869.65 MHz
#   short-range-device band. Only use it where that band is allowed. You are
#   the operator of the transmitter.
#
# Module CC1101 DIP switches: CSN=G5, GD00=G7, GD02=G10 (the pins set below).
#
# Secrets: add these three lines to your ESPHome secrets.yaml:
#   wifi_ssid: "your WiFi name"
#   wifi_password: "your WiFi password"
#   api_encryption_key: "<a key from https://esphome.io/components/api/>"

substitutions:
  device_name: termoweb-radio
  friendly_name: Termoweb Radio
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  sck_pin: "36"
  mosi_pin: "37"
  miso_pin: "35"
  csn_pin: "5"
  gdo0_pin: "7"
  gdo2_pin: "10"
  # Radio centre frequency in kHz. 869525 is the standard channel. Some heaters
  # have a receiver slightly off-frequency and only hear you a little lower
  # (for example 869475). Change it only if a heater never acknowledges.
  radio_frequency_khz: "869525"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    # termoweb_radio.h must sit next to this file in your ESPHome folder.
    - termoweb_radio.h
    - cores3_font.h
    - cores3_gfx.h
    - cores3_display.h
  on_boot:
    # CoreS3 SE: enable the M-Bus 5 V rail through the AW9523B expander.
    - priority: 500
      then:
        - lambda: |-
            i2c::I2CDevice aw;
            aw.set_i2c_bus(id(bus_a));
            aw.set_i2c_address(0x58);
            aw.write_byte(0x02, 0b00000111);
            aw.write_byte(0x03, 0b10000011);
            aw.write_byte(0x04, 0b00011000);
            aw.write_byte(0x05, 0b00001100);
            aw.write_byte(0x11, 0b00010000);
    # CoreS3 SE: light the screen backlight (AXP2101 DLDO1) at the saved brightness (see the Screen brightness slider below).
    - priority: 490
      then:
        - lambda: |-
            i2c::I2CDevice pmu;
            pmu.set_i2c_bus(id(bus_a));
            pmu.set_i2c_address(0x34);
            uint8_t ctrl = 0;
            pmu.read_byte(0x90, &ctrl);
            pmu.write_byte(0x99, 23);
            pmu.write_byte(0x90, ctrl | 0x80);
    # Late in boot, after WiFi is set up. Starts the radio and the TCP server.
    - priority: -100
      then:
        - delay: 500ms
        - lambda: |-
            termoweb::radio.set_pins(${sck_pin}, ${mosi_pin}, ${miso_pin}, ${csn_pin}, ${gdo0_pin}, ${gdo2_pin});
            // CoreS3 screen: chip select GPIO3, data/command GPIO35 (shared with MISO)
            cores3::display.install(3, 35);
            termoweb::radio.set_frequency_khz(${radio_frequency_khz});
            termoweb::radio.start();
        # Apply the saved brightness once Home Assistant restored it.
        - script.execute:
            id: set_backlight
            percent: !lambda return id(screen_brightness).state;

# CoreS3 SE internal I2C bus (AXP2101, AW9523B)
i2c:
  id: bus_a
  sda: GPIO12
  scl: GPIO11

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# INFO shows start-up and status lines. Change to DEBUG to also see every
# radio frame in the ESPHome log.
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If WiFi fails, the board opens its own hotspot with this name so you can
  # enter the WiFi details again.
  ap:
    ssid: "Thermoweb"

captive_portal:

# Announces the gateway on your network, so Home Assistant finds it by itself
# (Settings -> Devices & services -> Discovered). Nobody types an IP address.
# "mac" is the gateway's id (its WiFi MAC); "version" is the radio firmware.
mdns:
  services:
    - service: "_termoweb-radio"
      protocol: "_tcp"
      port: 2323
      txt:
        version: !lambda return termoweb::radio.version();
        mac: !lambda |-
          uint8_t mac[6] = {0};
          esp_read_mac(mac, ESP_MAC_WIFI_STA);
          char text[13];
          snprintf(text, sizeof(text), "%02x%02x%02x%02x%02x%02x", mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
          return std::string(text);

button:
  - platform: restart
    name: "Restart"

sensor:
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: template
    name: "Frames received"
    icon: mdi:radio-tower
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: |-
      return (float) termoweb::radio.frames_received();

binary_sensor:
  - platform: template
    name: "Home Assistant link"
    device_class: connectivity
    lambda: |-
      return termoweb::radio.client_connected();

text_sensor:
  - platform: wifi_info
    ip_address:
      # Only needed if Home Assistant does not find the gateway by itself.
      name: "IP address"
    mac_address:
      name: "MAC address"
  - platform: template
    name: "Firmware"
    entity_category: diagnostic
    update_interval: 3600s
    lambda: |-
      return termoweb::radio.version();

# Backlight level: AXP2101 DLDO1 (0x99) runs 2.5 V (dimmest) to 3.3 V (brightest) in 8 steps; 0 % switches it off.
script:
  - id: set_backlight
    parameters:
      percent: float
    then:
      - lambda: |-
          i2c::I2CDevice pmu;
          pmu.set_i2c_bus(id(bus_a));
          pmu.set_i2c_address(0x34);
          uint8_t ctrl = 0;
          pmu.read_byte(0x90, &ctrl);
          if (!(percent > 0)) {
            pmu.write_byte(0x90, ctrl & ~0x80);
          } else {
            pmu.write_byte(0x99, 20 + (int) roundf(percent * 8.0f / 100.0f));
            pmu.write_byte(0x90, ctrl | 0x80);
          }

number:
  - platform: template
    id: screen_brightness
    name: "Screen brightness"
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 10
    initial_value: 40
    restore_value: true
    optimistic: true
    set_action:
      - script.execute:
          id: set_backlight
          percent: !lambda return x;

switch:
  # Flip this if the screen colours look inverted.
  - platform: template
    name: "Screen invert colours"
    icon: mdi:invert-colors
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: cores3::display.set_invert(true);
    turn_off_action:
      - lambda: cores3::display.set_invert(false);

# Touch screen (FT6336U, I2C 0x38): a tap anywhere shows the next heater.
interval:
  - interval: 50ms
    then:
      - lambda: |-
          static bool down = false;
          static uint32_t last_tap = 0;
          i2c::I2CDevice touch;
          touch.set_i2c_bus(id(bus_a));
          touch.set_i2c_address(0x38);
          uint8_t points = 0;
          if (!touch.read_byte(0x02, &points)) return;
          const bool now_down = (points & 0x0F) > 0 && (points & 0x0F) < 3;
          if (now_down && !down && millis() - last_tap > 300) {
            last_tap = millis();
            ESP_LOGI("touch", "tap");
            cores3::display.next_page();
          }
          down = now_down;
