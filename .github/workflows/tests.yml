name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # Latest 3.14 patch: early 3.14 releases break mock autospec on functions
      # with deferred annotations, which the real recorder test fixture uses.
      - name: Install Python requirement
        run: uv python install 3.14

      - name: Install locked project dependencies
        run: uv sync --locked --extra test

      - name: Run tests on real Home Assistant
        run: |
          set -o pipefail
          timeout 120s uv run pytest --cov | tee coverage-report.txt

      - name: Generate coverage XML
        run: uv run coverage xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-artifacts
          path: |
            coverage-report.txt
            coverage.xml
            .coverage
          include-hidden-files: true

  coverage-badge:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-artifacts

      - name: Prepare badge directory
        run: mkdir -p docs/badges

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # coverage-badge must parse the source with the project's Python (3.14
      # syntax), so run it under uv instead of the runner's system Python.
      - name: Generate coverage badge
        run: >-
          uv tool run --python 3.14 --from coverage-badge==1.1.2 --with coverage==7.16.2 --with 'setuptools<81'
          coverage-badge -f -o docs/badges/coverage.svg

      - name: Commit updated coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: update coverage badge"
            git push origin HEAD:main
          fi
