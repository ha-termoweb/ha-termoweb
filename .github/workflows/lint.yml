name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python requirement
        run: uv python install 3.14

      - name: Install locked project dependencies
        run: uv sync --locked --extra test

      - name: Ruff lint
        run: uv run ruff check custom_components tests

      - name: Ruff format check
        run: uv run ruff format --check custom_components tests

      - name: Function map up to date
        run: |
          uv run python3 scripts/generate_function_map.py --output "$RUNNER_TEMP/function_map.txt"
          diff -u docs/function_map.txt "$RUNNER_TEMP/function_map.txt" \
            || { echo "docs/function_map.txt is stale: run 'uv run python3 scripts/generate_function_map.py' and commit."; exit 1; }
