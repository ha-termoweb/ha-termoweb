set_schedule:
  name: Set weekly schedule
  description: >-
    Set the 7×24 weekly program for a TermoWeb heater. The program is a list of
    168 integers, where each value corresponds to one hour of the week starting
    Monday 00:00. Use 0 for the cold preset, 1 for the night preset and 2 for
    the day preset.
  target:
    entity:
      domain: climate
      integration: termoweb
  fields:
    prog:
      name: Program
      description: >-
        A list of 168 integers (0, 1 or 2) representing the heater’s weekly
        schedule. Index 0 is Monday 00:00, index 1 is Monday 01:00, and so on.
      example: '[0,0,0,1,1,2,2,0,1,2,0,...]'
      required: true

set_preset_temperatures:
  name: Set preset temperatures
  description: >-
    Set the cold, night and day preset temperatures for a TermoWeb heater. You
    can either provide all three temperatures as a single list (``ptemp``) or
    specify each one separately (``cold``, ``night`` and ``day``).
  target:
    entity:
      domain: climate
      integration: termoweb
  fields:
    ptemp:
      name: Preset temperatures
      description: >-
        A list of three temperatures [cold, night, day] in the same units as
        the heater (°C or °F). If provided, this will override individual cold,
        night and day values.
      example: '[10.0, 16.0, 20.0]'
    cold:
      name: Cold preset
      description: Temperature for the cold preset (°C or °F).
      example: 10.0
    night:
      name: Night preset
      description: Temperature for the night preset (°C or °F).
      example: 16.0
    day:
      name: Day preset
      description: Temperature for the day preset (°C or °F).
      example: 20.0

set_acm_preset:
  name: Configure accumulator boost preset
  description: >-
    Update the default boost duration and/or temperature for a TermoWeb
    accumulator. Minutes must be between 60 and 600 in 60-minute increments;
    omit a field to keep the existing value.
  target:
    entity:
      domain: climate
      integration: termoweb
  fields:
    minutes:
      name: Default boost duration
      description: Number of minutes the boost should run when no override is provided (60–600, step 60).
      example: 120
      selector:
        number:
          min: 60
          max: 600
          step: 60
          unit_of_measurement: minutes
    temperature:
      name: Boost temperature
      description: Optional boost setpoint to apply during the boost session (°C or °F).
      example: 22.5

start_boost:
  name: Start accumulator boost
  description: >-
    Trigger an immediate boost on a TermoWeb accumulator. Provide a duration to
    override the default (60–600 minutes in 60-minute increments), or omit it to
    use the stored preset.
  target:
    entity:
      domain: climate
      integration: termoweb
  fields:
    minutes:
      name: Boost duration
      description: Duration of the boost session in minutes (60–600, step 60). Optional.
      example: 180
      selector:
        number:
          min: 60
          max: 600
          step: 60
          unit_of_measurement: minutes

cancel_boost:
  name: Cancel accumulator boost
  description: Cancel the active boost session on a TermoWeb accumulator.
  target:
    entity:
      domain: climate
      integration: termoweb

import_energy_history:
  name: Import energy history
  description: >-
    Import historical hourly energy counters for TermoWeb heaters up to one
    year ago into Home Assistant statistics for every configured heater.
  fields:
    reset_progress:
      name: Reset progress
      description: >-
        Clear stored progress and re-import history from scratch.
      default: false
      selector:
        boolean: {}
    max_history_retrieval:
      name: Max history days
      description: >-
        Number of days of history to retrieve. Overrides the configured
        default for this import only.
      default: 7
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: days

ws_debug_probe:
  name: Emit websocket debug probe
  description: >-
    Request an immediate ``dev_data`` refresh from the websocket client and log
    the next ``dev_handshake`` and ``update`` frame sizes. Enable the debug
    option in the integration settings before using this helper.
  fields:
    entry_id:
      name: Config entry ID
      description: Restrict the probe to a single TermoWeb config entry.
      example: abcd1234deadbeef
    dev_id:
      name: Device ID
      description: Restrict the probe to a single gateway device.
      example: 0000abcd

radio_survey:
  name: Radio survey
  description: >-
    Listen to all radio traffic on the heater band, also in dialects this
    integration does not know, and save a report file in the configuration
    folder for a GitHub issue.
  fields:
    entry_id:
      name: Config entry ID
      description: The radio gateway or nanoCUL config entry to use.
      required: true
      example: abcd1234deadbeef
      selector:
        config_entry:
          integration: termoweb
    seconds:
      name: Duration
      description: How long to listen.
      default: 120
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s

radio_capture:
  name: Radio capture
  description: >-
    Record every radio frame the gateway or nanoCUL hears and save it as a
    JSON file in the configuration folder. It never transmits. On a normal
    radio entry, heater commands wait until the capture ends.
  fields:
    entry_id:
      name: Config entry ID
      description: The radio gateway or nanoCUL config entry to use.
      required: true
      example: abcd1234deadbeef
      selector:
        config_entry:
          integration: termoweb
    seconds:
      name: Duration
      description: How long to record.
      default: 120
      selector:
        number:
          min: 10
          max: 1800
          unit_of_measurement: s
    redact:
      name: Hide private data
      description: >-
        Replace network ids and heater serial numbers in the file.
      default: false
      selector:
        boolean:
    note:
      name: Note
      description: Optional text saved in the file.
      example: identify on the living room heater
      selector:
        text:

radio_factory_reset:
  name: Radio factory reset
  description: >-
    DESTRUCTIVE. Reset one radio heater to its factory settings. The heater
    loses all settings, its clock, its weekly program and its radio pairing,
    and stops talking to Home Assistant. Its last known settings are saved
    first. To use the heater again, run "Radio pair" with the same heater
    number and press the pairing button on the heater. Only dialect-B heaters
    can be reset.
  fields:
    entry_id:
      name: Config entry ID
      description: The radio gateway or nanoCUL config entry to use.
      required: true
      example: abcd1234deadbeef
      selector:
        config_entry:
          integration: termoweb
    heater:
      name: Heater number
      description: The heater's radio number (the number in "Heater 6").
      required: true
      example: 6
      selector:
        number:
          min: 1
          max: 254
          mode: box

radio_pair:
  name: Radio pair
  description: >-
    Pair one radio heater. Start this action, then press the pairing button
    on the heater. With a heater number, the heater gets that number back
    (use this after a factory reset) and its saved settings are restored.
    Without a heater number, a new heater is added and the integration
    reloads. Heater control pauses while pairing runs.
  fields:
    entry_id:
      name: Config entry ID
      description: The radio gateway or nanoCUL config entry to use.
      required: true
      example: abcd1234deadbeef
      selector:
        config_entry:
          integration: termoweb
    heater:
      name: Heater number
      description: >-
        Pair the heater back to this number. Leave empty to add a new heater.
      required: false
      example: 6
      selector:
        number:
          min: 1
          max: 254
          mode: box
    restore:
      name: Restore settings
      description: >-
        Give the heater back its presets, mode and weekly program after
        pairing.
      default: true
      selector:
        boolean:
    timeout:
      name: Wait time
      description: How long to wait for the heater's pairing button.
      default: 300
      selector:
        number:
          min: 30
          max: 600
          unit_of_measurement: s

radio_rehome:
  name: Radio move heaters to own network
  description: >-
    Move all heaters of a radio entry onto this installation's own radio
    network. Each heater is reset first (its settings are saved), then you
    put the heaters into pairing mode one at a time. The heaters get new
    numbers from 2 upwards and their settings are restored. Only dialect-B
    heaters can be moved. Heater control pauses while this runs.
  fields:
    entry_id:
      name: Config entry ID
      description: The radio gateway or nanoCUL config entry to use.
      required: true
      example: abcd1234deadbeef
      selector:
        config_entry:
          integration: termoweb
    timeout:
      name: Wait time
      description: How long to wait for the heaters' pairing buttons.
      default: 300
      selector:
        number:
          min: 30
          max: 600
          unit_of_measurement: s
