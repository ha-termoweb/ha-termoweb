[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ARG",     # fixtures and mocks have unused arguments by design
  "BLE001",  # tests catch broad exceptions to assert on failure modes
  "D",       # test names and bodies document themselves; no docstring policy
  "INP001",  # tests/ subfolders are not packages
  "PLC0415", # imports inside tests are used to patch/reload modules
  "PLR2004", # magic values are the point of assertions
  "PT",      # pytest-style opinions (parametrize names, raises match) not enforced
  "S",       # asserts, hard-coded tokens and temp paths are fine in tests
  "SLF001",  # tests exercise private members
  "TRY",     # exception-style rules are irrelevant for test doubles
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]
