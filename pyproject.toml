[project]
name = "ha-termoweb"
version = "2.3.1"
description = "TermoWeb heaters integration for Home Assistant"
readme = "README.md"
authors = [{ name = "ha-termoweb" }]
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.10.0",
    "aiohttp>=3.12.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component==0.13.371",
    "pytest-randomly>=5.0.0",
    "ruff==0.17.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/termoweb"]

[tool.hatch.build.targets.sdist]
include = [
    "custom_components/termoweb",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Home Assistant's own http component (pulled in by diagnostics) stores
    # plain-string keys on its aiohttp app and requests; not fixable here.
    "ignore:It is recommended to use web\\.(AppKey|RequestKey) instances for keys:aiohttp.web_exceptions.NotAppKeyWarning",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["custom_components.termoweb"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true


